<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#062e9d" />
    <meta name="description" content="Share your idea for Aptamil's next innovation in infant nutrition." />
    <title>What's Next? | Aptamil Innovation Pavilion</title>
    <link rel="stylesheet" href="styles.css?v=20261125-viewport" />
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="poster" aria-labelledby="question">
        <img class="header-gradient" src="assets/header-gradient.png" alt="" aria-hidden="true" />
        <img class="sky-wave" src="assets/sky-wave.png" alt="" aria-hidden="true" />
        <img class="logo" src="assets/aptamil-logo.png" alt="Aptamil" />
        <div class="content">
          <h1 id="question" class="question">
            <span class="line lead">What do you think</span>
            <strong class="line brand">Aptamil’s</strong>
            <span class="line innovation">next innovation in</span>
            <strong class="line nutrition">infant nutrition</strong>
            <span class="line closing">Will be?</span>
          </h1>

          <form id="idea-form" class="idea-form" method="post" target="submission-frame" novalidate>
            <label for="idea" class="visually-hidden">Your idea</label>
            <textarea id="idea" name="response" maxlength="1000" required aria-required="true"></textarea>
            <input type="hidden" name="requestId" id="request-id" />
            <button id="submit-button" type="submit">Submit</button>
          </form>

          <p id="status" class="status" role="status" aria-live="polite"></p>
          <p class="footer">Aptamil <span aria-hidden="true">·</span> Innovation Pavilion</p>
        </div>
      </section>
    </main>
    <iframe class="submission-frame" name="submission-frame" title="Submission result"></iframe>
  </body>
</html>
